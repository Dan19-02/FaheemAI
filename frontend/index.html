<!doctype html>
<!-- Faheem is Arabic-first: seed lang/dir here so the very first paint is RTL,
     before JS hydrates and LocaleProvider takes over syncing these attributes. -->
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta
      name="description"
      content="Faheem is a calm, patient AI teacher and doubt solver for Bahrain MoE, CBSE and Cambridge students in grades 9 to 12. It explains the doubts you missed in class, again and again, a different way each time, until it clicks. Physics, Chemistry, Maths, Biology and more, in Arabic and English."
    />
    <meta name="theme-color" content="#CE1126" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Open Graph / social preview -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Faheem" />
    <meta property="og:locale" content="ar_BH" />
    <meta property="og:locale:alternate" content="en" />
    <meta property="og:title" content="Faheem — Patient AI tutor for Bahrain MoE, CBSE and Cambridge" />
    <meta
      property="og:description"
      content="A calm, patient AI teacher and doubt solver for Bahrain MoE, CBSE and Cambridge, grades 9 to 12. It explains what you missed in class, again and again, until it clicks. Arabic and English."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Faheem — Patient AI tutor for Bahrain MoE, CBSE and Cambridge" />
    <meta
      name="twitter:description"
      content="A calm, patient AI teacher and doubt solver for Bahrain MoE, CBSE and Cambridge. It stays until it clicks. Arabic and English."
    />

    <title>فهيم · Faheem — Curriculum-grounded tutor</title>

    <!-- Google Identity Services: powers the "Continue with Google" button.
         Loads async and only initializes when VITE_GOOGLE_CLIENT_ID is set. -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <!-- Structured data: only true facts (no ratings or user counts). Helps
         search engines understand what Faheem is and who it serves. Free during
         the Bahrain pilot, so a single free Offer, no prices. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "EducationalOrganization",
            "@id": "#org",
            "name": "Faheem",
            "logo": "/favicon.svg",
            "description": "A calm, patient AI teacher and doubt solver for students in Bahrain. It explains what you missed in class, again and again, a different way each time, until it clicks.",
            "areaServed": "BH",
            "knowsLanguage": ["ar", "en"],
            "audience": {
              "@type": "EducationalAudience",
              "educationalRole": "student"
            }
          },
          {
            "@type": "WebSite",
            "@id": "#website",
            "name": "Faheem",
            "publisher": { "@id": "#org" },
            "inLanguage": ["ar", "en"]
          },
          {
            "@type": "SoftwareApplication",
            "name": "Faheem",
            "applicationCategory": "EducationApplication",
            "operatingSystem": "Web, Android, iOS",
            "publisher": { "@id": "#org" },
            "description": "AI doubt solver and patient teacher for Bahrain MoE, CBSE and Cambridge students in grades 9 to 12, across Physics, Chemistry, Maths and Biology, in Arabic and English.",
            "offers": {
              "@type": "Offer",
              "name": "Bahrain pilot",
              "price": "0",
              "priceCurrency": "BHD",
              "description": "Free during the Bahrain pilot: the whole teacher, no card needed."
            }
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

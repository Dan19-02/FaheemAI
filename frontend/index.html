<!doctype html>
<!-- Faheem is Arabic-first: seed lang/dir here so the very first paint is RTL,
     before JS hydrates and LocaleProvider takes over syncing these attributes. -->
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta
      name="description"
      content="فهيم معلّم ذكاء اصطناعي صبور بالعربية، يعرف مقرّرك البحريني بالضبط. يشرح ما فاتك في الصف مرّةً بعد مرّة، بطريقة مختلفة في كلّ مرّة، حتّى تفهم. لطلاب منهج البحرين وCBSE وCambridge من الصف التاسع إلى الثاني عشر، بالعربية والإنجليزية. Faheem: an Arabic-first, curriculum-grounded AI tutor for Bahrain MoE, CBSE and Cambridge, grades 9 to 12."
    />
    <meta name="theme-color" content="#CE1126" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Open Graph / social preview -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Faheem" />
    <meta property="og:locale" content="ar_BH" />
    <meta property="og:locale:alternate" content="en" />
    <meta property="og:title" content="فهيم · Faheem, معلّم صبور بلغتك، يعرف مقرّرك البحريني" />
    <meta
      property="og:description"
      content="معلّم ذكاء اصطناعي صبور بالعربية، مبنيّ على منهج البحرين، يشرح ما فاتك في الصف حتّى تفهم. منهج البحرين وCBSE وCambridge، الصفوف 9 إلى 12. بالعربية والإنجليزية."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="فهيم · Faheem, معلّم صبور بلغتك" />
    <meta
      name="twitter:description"
      content="معلّم صبور بالعربية يعرف مقرّرك البحريني بالضبط، ويبقى معك حتّى تفهم. منهج البحرين وCBSE وCambridge. مجّاني خلال تجربة البحرين."
    />

    <title>فهيم · Faheem, معلّم صبور بلغتك، يعرف مقرّرك البحريني</title>

    <!-- Google Identity Services: powers the "Continue with Google" button.
         Loads async and only initializes when VITE_GOOGLE_CLIENT_ID is set. -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <!-- Structured data: only true facts (no ratings or user counts). Helps
         search engines understand what Faheem is and who it serves. Free during
         the Bahrain pilot, so a single free Offer, no prices. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "EducationalOrganization",
            "@id": "#org",
            "name": "Faheem",
            "logo": "/favicon.svg",
            "description": "A calm, patient AI teacher and doubt solver for students in Bahrain. It explains what you missed in class, again and again, a different way each time, until it clicks.",
            "areaServed": "BH",
            "knowsLanguage": ["ar", "en"],
            "audience": {
              "@type": "EducationalAudience",
              "educationalRole": "student"
            }
          },
          {
            "@type": "WebSite",
            "@id": "#website",
            "name": "Faheem",
            "publisher": { "@id": "#org" },
            "inLanguage": ["ar", "en"]
          },
          {
            "@type": "SoftwareApplication",
            "name": "Faheem",
            "applicationCategory": "EducationApplication",
            "operatingSystem": "Web, Android, iOS",
            "publisher": { "@id": "#org" },
            "description": "AI doubt solver and patient teacher for Bahrain MoE, CBSE and Cambridge students in grades 9 to 12, across Physics, Chemistry, Maths and Biology, in Arabic and English.",
            "offers": {
              "@type": "Offer",
              "name": "Bahrain pilot",
              "price": "0",
              "priceCurrency": "BHD",
              "description": "Free during the Bahrain pilot: the whole teacher, no card needed."
            }
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

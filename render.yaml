# ============================================================================
# Faheem — Render Blueprint (Infrastructure as Code)
# Spec: https://render.com/docs/blueprint-spec
# ----------------------------------------------------------------------------
# Applying this file (Render Dashboard -> New -> Blueprint, point at this repo)
# provisions the whole stack in one shot:
#
#   faheem-db        managed PostgreSQL (all durable state: users, curriculum, corpus)
#   faheem-backend   Node web service — Express + WebSocket API (esbuild -> dist/index.cjs)
#   faheem-frontend  static site — React 19 + Vite SPA (dist/), served from Render's CDN
#
# AFTER the first apply you MUST do two things in the dashboard (see DEPLOY.md):
#   1. Set GEMINI_API_KEY on faheem-backend (required for all AI features).
#   2. Confirm the two service URLs below actually match what Render assigned
#      (CORS_ORIGIN on the backend must equal the frontend URL, and VITE_API_URL
#      on the frontend must equal the backend URL). If Render appended a suffix
#      because a name was taken, update both values and redeploy.
#
# Region is frankfurt (closest Render region to Bahrain). If the free tier is not
# available there for you, change `region:` or bump `plan:`.
# ============================================================================

databases:
  - name: faheem-db
    plan: free              # free Postgres is deleted after ~30 days — upgrade for production
    region: frankfurt
    databaseName: faheem
    user: faheem

services:
  # -------------------------------------------------------------------------
  # Backend — Express + Postgres + WebSocket API (single $PORT, binds 0.0.0.0)
  # -------------------------------------------------------------------------
  - type: web
    name: faheem-backend
    runtime: node
    plan: free              # free web services cold-start after ~15 min idle
    region: frankfurt
    rootDir: backend
    # devDependencies (esbuild) are needed to build — do NOT set NODE_ENV=production
    # or NPM_CONFIG_PRODUCTION here, or `npm run build` will fail.
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: DATABASE_URL
        fromDatabase:
          name: faheem-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true          # Render generates a strong random secret
      - key: GEMINI_API_KEY
        sync: false                  # REQUIRED — paste your Google Gemini API key
      - key: GOOGLE_CLIENT_ID
        sync: false                  # optional — enables "Continue with Google"
      - key: CORS_ORIGIN
        value: https://faheem-frontend.onrender.com   # MUST equal the frontend URL

  # -------------------------------------------------------------------------
  # Frontend — React + Vite single-page app, published as a static site
  # -------------------------------------------------------------------------
  - type: web
    name: faheem-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      # Baked into the bundle at BUILD time — must be the backend origin, with
      # scheme, no trailing slash. Change it here (not at runtime) then redeploy.
      - key: VITE_API_URL
        value: https://faheem-backend.onrender.com    # MUST equal the backend URL
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false                  # optional — same value as backend GOOGLE_CLIENT_ID
    routes:
      # SPA fallback: serve index.html for any client-side path (deep links / refresh).
      - type: rewrite
        source: /*
        destination: /index.html

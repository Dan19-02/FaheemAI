# Faheem on Render: one blueprint, three resources (db + API + static site).
#
# FREE-TIER RULE: a Render workspace can hold only ONE active free Postgres.
# If another project already occupies the free database slot, either delete or
# upgrade that database in the Render dashboard and re-apply this blueprint,
# OR delete the `databases:` block below and instead set DATABASE_URL on
# faheem-backend by hand (any reachable Postgres connection string works).
#
# After the first deploy, set the sync:false secrets on faheem-backend in the
# dashboard: KIMI_API_KEY (answer brain), GEMINI_API_KEY (vision, embeddings,
# RAG ingest, fallback), RESEND_API_KEY + MAIL_FROM (email), and the payment
# provider keys when payments go live.

databases:
  - name: faheem-db
    plan: free
    databaseName: faheem
    user: faheem

services:
  - type: web
    name: faheem-backend
    runtime: node
    plan: free
    rootDir: backend
    # --include=dev because the bundler (esbuild) is a devDependency and
    # NODE_ENV=production would otherwise strip it from the install.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: faheem-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: OTP_PEPPER
        generateValue: true
      - key: ANSWER_BACKEND
        value: kimi
      - key: KIMI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: SUPPORT_EMAIL
        value: support@clarifyai.in
      # Must match the static site's public URL exactly (scheme, no slash).
      - key: CORS_ORIGIN
        value: https://faheem-frontend.onrender.com

  - type: web
    name: faheem-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    # SPA: every route serves the app shell.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Baked in at build time; must be the backend's public URL (no slash).
      - key: VITE_API_URL
        value: https://faheem-backend.onrender.com
